# =============================================================================
# Veracode SAST + Bitbucket Code Insights (Bitbucket Pipelines, Bitbucket Cloud)
#
# Rename to bitbucket-pipelines.yml, or copy the steps into your own file.
#
#   Push to the default branch -> Policy Scan
#   Push to any other branch   -> Sandbox scan (sandbox = branch name)
#   custom: veracode-sync      -> posts every finished scan as a report on its commit.
#                                 Schedule it (docs/SETUP.md); builds don't wait for scans.
#
# Inline mode (report in the same build, the runner waits for the scan): add
# "- step: *code-insights" after "- step: *scan".
#
# Repository variables (Repository settings > Pipelines > Repository variables):
#   VERACODE_API_ID     Veracode API ID   (Secured)
#   VERACODE_API_KEY    Veracode API key  (Secured)
#                       API account roles: Upload and Scan API + Results API
#   VERACODE_APP_NAME   Optional. Default: <workspace>/<repo>
#   DEFAULT_BRANCH      Optional. Branch that gets the policy scan. Default: main
#
# No Bitbucket token is needed: the report step uses the Pipelines proxy.
#
# The Veracode CLI and the API wrapper are pinned to a version and
# checked against their SHA-256, because secured variables are available to every step.
# Python packages are capped at the next major version (not hash-pinned). To upgrade a tool, change the
# version and its checksum together (sha256sum of the downloaded file):
#   latest CLI:     curl -fsS https://tools.veracode.com/veracode-cli/LATEST_VERSION
#   latest wrapper: <release> in https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java/maven-metadata.xml
#
# Post one commit's results now: Run pipeline > custom: veracode-report on that commit.
# =============================================================================

image: maven:3.9-eclipse-temurin-17

definitions:
  steps:
    # Package the application with the Veracode CLI autopackager.
    - step: &package
        name: Package for Veracode
        script:
          - CLI_VERSION=2.55.0
          - CLI_SHA256=44fde332acc9401f51486404dba3289cff894cf32aafda612e0a8f1cbc1b2140
          - curl -fsSLo /tmp/cli.tgz "https://tools.veracode.com/veracode-cli/veracode-cli_${CLI_VERSION}_linux_x86.tar.gz"
          - echo "$CLI_SHA256  /tmp/cli.tgz" | sha256sum -c -
          - tar xzf /tmp/cli.tgz -C /tmp
          - /tmp/veracode-cli_${CLI_VERSION}_linux_x86/veracode package --source . --output verascan --trust
        artifacts:
          - verascan/**

    # Upload and start the scan. The scan version is "<commit SHA>-<build number>":
    # reports are posted on that commit.
    - step: &scan
        name: Veracode scan (policy or sandbox)
        script:
          - WRAPPER=26.10.20.1
          - WRAPPER_SHA256=415764c77de672bcf2acaf61cdd9ab466f4cb45766b1650ab7b4673166736ad5
          - curl -fsSLo /tmp/VeracodeJavaAPI.jar "https://repo1.maven.org/maven2/com/veracode/vosp/api/wrappers/vosp-api-wrappers-java/$WRAPPER/vosp-api-wrappers-java-$WRAPPER.jar"
          - echo "$WRAPPER_SHA256  /tmp/VeracodeJavaAPI.jar" | sha256sum -c -
          - |
            set -- -appname "${VERACODE_APP_NAME:-$BITBUCKET_REPO_FULL_NAME}" \
                   -version "${BITBUCKET_COMMIT}-${BITBUCKET_BUILD_NUMBER}" \
                   -filepath verascan -createprofile false
            if [ "$BITBUCKET_BRANCH" = "${DEFAULT_BRANCH:-main}" ]; then
              # Never delete a policy scan still running (use 2 to replace it instead).
              set -- "$@" -deleteincompletescan 1
            else
              set -- "$@" -sandboxname "$BITBUCKET_BRANCH" -createsandbox true -deleteincompletescan 2
            fi
            if ! java -jar /tmp/VeracodeJavaAPI.jar -vid "$VERACODE_API_ID" -vkey "$VERACODE_API_KEY" \
                      -action UploadAndScan "$@" > /tmp/scan.log 2>&1; then
              cat /tmp/scan.log
              # A previous scan of this application is still running: not an error.
              grep -q "A scan is in progress" /tmp/scan.log || exit 1
              echo "Not scanned: the previous scan is still running. The next push scans the latest code."
            else
              cat /tmp/scan.log
            fi

    # Post finished scans as Code Insights reports. The script is downloaded from your
    # organization's copy (docs/SETUP.md step 0) and run from /tmp with "python -I" so
    # files in the checkout cannot replace its modules. VBI_TOKEN: optional secured
    # variable, sent as a Bearer token when your copy needs authentication.
    # No pip cache: caches are shared by all branches, so one branch could poison it.
    - step: &code-insights-sync
        name: Veracode Code Insights sync
        image: python:3.12
        script:
          - VBI_URL="<download URL of veracode_bb_insights.py in your organization>"
          - |
            if [ -n "${VBI_TOKEN:-}" ]; then
              echo "Downloading VBI script with authentication"
              curl -fsSL \
                -H "Authorization: Bearer $VBI_TOKEN" \
                -o /tmp/vbi.py \
                "$VBI_URL"
            else
              echo "Downloading VBI script without authentication"
              curl -fsSL \
                -o /tmp/vbi.py \
                "$VBI_URL"
            fi
          - 'head -n1 /tmp/vbi.py | grep -q python || { echo "VBI_URL did not return the script (a web or login page?). Use the raw file URL, see docs/SETUP.md step 0."; exit 1; }'
          - pip install -q "requests>=2.33,<3" "urllib3>=2.8,<3" && pip install -q --no-deps "veracode-api-signing>=24.0,<27"
          - python -I /tmp/vbi.py --sync --repo-dir "$BITBUCKET_CLONE_DIR" --default-branch "${DEFAULT_BRANCH:-main}"
    
    - step: &code-insights
        name: Veracode Code Insights
        image: python:3.12
        artifacts:
          download: false
        script:
          - VBI_URL="<download URL of veracode_bb_insights.py in your organization>"
          - |
            if [ -n "${VBI_TOKEN:-}" ]; then
              echo "Downloading VBI script with authentication"
              curl -fsSL \
                -H "Authorization: Bearer $VBI_TOKEN" \
                -o /tmp/vbi.py \
                "$VBI_URL"
            else
              echo "Downloading VBI script without authentication"
              curl -fsSL \
                -o /tmp/vbi.py \
                "$VBI_URL"
            fi
          - 'head -n1 /tmp/vbi.py | grep -q python || { echo "VBI_URL did not return the script (a web or login page?). Use the raw file URL, see docs/SETUP.md step 0."; exit 1; }'
          - pip install -q "requests>=2.33,<3" "urllib3>=2.8,<3" && pip install -q --no-deps "veracode-api-signing>=24.0,<27"
          - python -I /tmp/vbi.py --repo-dir "$BITBUCKET_CLONE_DIR" --default-branch "${DEFAULT_BRANCH:-main}" --wait 60

pipelines:
  default:            # every branch push (tags excluded)
    - step: *package
    - step: *scan
  custom:
    veracode-sync:    # schedule this one
      - step: *code-insights-sync
    veracode-report:  # Run pipeline on a commit to post its results now
      - step: *code-insights
